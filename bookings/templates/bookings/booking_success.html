{% extends "core/base.html" %}


{% block title %}
Booking Successful | BikeRental
{% endblock %}


{% block content %}

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="card text-center">

                    <div class="card-body p-5">


                        <!-- Success Icon -->

                        <div class="fs-1 mb-3">

                            ✅

                        </div>


                        <!-- Success Heading -->

                        <h1 class="fw-bold mb-3">

                            Booking Successful!

                        </h1>


                        <!-- Success Message -->

                        <p class="text-muted mb-4">

                            Your bike has been booked successfully.
                            We hope you enjoy your ride!

                        </p>


                        <!-- Explore Bikes Button -->

                        <a
                            href="{% url 'bike_list' %}"
                            class="btn btn-dark px-4"
                        >

                            Explore More Bikes

                        </a>


                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
